name: Glimpse
options:
  bundleIdPrefix: com.anglerdw
  # CFBundleDevelopmentRegion: the .lproj used when none of the user's languages is one of the 11 Glimpse ships,
  # so a Dutch or Vietnamese user gets English. The String Catalogs' source language stays zh-Hans (the keys are
  # the Chinese text); the two are independent.
  developmentLanguage: en
  deploymentTarget:
    macOS: "14.0"
packages:
  GlimpseCore:
    path: Core
targets:
  Glimpse:
    type: application
    platform: macOS
    sources:
      - App/Sources
      - path: App/Resources
        excludes:
          - "AppIcon/**" # SVG sources and Icon Composer layers; the rendered Assets.xcassets is what ships
      - path: App/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        LSUIElement: true
        # Source-language values; the other languages live in App/Resources/InfoPlist.xcstrings
        # (generated from scripts/i18n/strings.json).
        NSDownloadsFolderUsageDescription: Glimpse 需要把截图保存到「下载」文件夹。
        NSDesktopFolderUsageDescription: Glimpse 需要把截图保存到「桌面」文件夹。
        NSDocumentsFolderUsageDescription: Glimpse 需要把截图保存到「文稿」文件夹。
        LSApplicationCategoryType: public.app-category.utilities
        CFBundleDisplayName: Glimpse
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        NSHumanReadableCopyright: © 2026 AnglerDW
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anglerdw.glimpse
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: targeted
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Required for notarization; harmless for ad-hoc builds. scripts/release.sh signs with
        # `--options runtime` so the flag actually lands in the signature (Xcode signing is off).
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - package: GlimpseCore
    scheme: {}
