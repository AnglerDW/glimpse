<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Glimpse App 图标（方案 A3：取景框里一扇磨砂玻璃窗口）。1024 画布，824 圆角方块，macOS 图标网格。
       这份是 macOS 14 / 15 用的平面渲染源；macOS 26 的分层版见 layers/。 -->
  <defs>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
    <linearGradient id="tileBlue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B4DCFF"/><stop offset=".55" stop-color="#5E97F2"/><stop offset="1" stop-color="#3466DE"/></linearGradient>
    <radialGradient id="sheen" cx=".32" cy=".06" r=".75"><stop offset="0" stop-color="#fff" stop-opacity=".34"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <radialGradient id="vign" cx=".85" cy="1" r=".8"><stop offset="0" stop-color="#1B3A9C" stop-opacity=".30"/><stop offset="1" stop-color="#1B3A9C" stop-opacity="0"/></radialGradient>
    <linearGradient id="glassBody" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E3ECFB"/></linearGradient>
    <linearGradient id="glassHi" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="frost" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".92"/><stop offset="1" stop-color="#fff" stop-opacity=".74"/></linearGradient>
    <path id="brk" d="M206 398V290a84 84 0 0 1 84-84h108M626 206h108a84 84 0 0 1 84 84v108M818 626v108a84 84 0 0 1-84 84H626M398 818H290a84 84 0 0 1-84-84V626"/>
    <mask id="brkMask"><use xlink:href="#brk" fill="none" stroke="#fff" stroke-width="60" stroke-linecap="round" stroke-linejoin="round"/></mask>
    <clipPath id="winClip"><rect x="318" y="356" width="388" height="312" rx="46"/></clipPath>
    <filter id="shBrk" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="18" stdDeviation="15" flood-color="#0B2A75" flood-opacity=".42"/></filter>
    <filter id="shWin" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#0B2A75" flood-opacity=".40"/></filter>
    <filter id="b10"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>

  <!-- 底 -->
  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#tileBlue)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#vign)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#sheen)"/>
  </g>

  <!-- 取景角：影 → 体 → 顶光 → 描边 -->
  <g filter="url(#shBrk)"><use xlink:href="#brk" fill="none" stroke="url(#glassBody)" stroke-width="60" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g mask="url(#brkMask)">
    <use xlink:href="#brk" fill="none" stroke="url(#glassHi)" stroke-width="60" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 -22)" filter="url(#b10)"/>
  </g>
  <use xlink:href="#brk" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>

  <!-- 磨砂玻璃窗口 -->
  <g filter="url(#shWin)"><rect x="318" y="356" width="388" height="312" rx="46" fill="url(#frost)"/></g>
  <g clip-path="url(#winClip)">
    <rect x="318" y="356" width="388" height="76" fill="#fff" opacity=".55"/>
    <rect x="318" y="430" width="388" height="3" fill="#fff" opacity=".9"/>
    <ellipse cx="420" cy="380" rx="220" ry="60" fill="#fff" opacity=".45" filter="url(#b10)"/>
  </g>
  <circle cx="362" cy="394" r="12.5" fill="#FF5F57"/><circle cx="400" cy="394" r="12.5" fill="#FEBC2E"/><circle cx="438" cy="394" r="12.5" fill="#28C840"/>
  <g fill="#fff" opacity=".55"><ellipse cx="358" cy="389" rx="6" ry="4"/><ellipse cx="396" cy="389" rx="6" ry="4"/><ellipse cx="434" cy="389" rx="6" ry="4"/></g>
  <g fill="#3A62B8" opacity=".55">
    <rect x="354" y="472" width="200" height="24" rx="12"/>
    <rect x="354" y="520" width="300" height="24" rx="12" opacity=".7"/>
    <rect x="354" y="568" width="240" height="24" rx="12" opacity=".7"/>
    <rect x="354" y="616" width="150" height="24" rx="12" opacity=".7"/>
  </g>
  <rect x="318" y="356" width="388" height="312" rx="46" fill="none" stroke="#fff" stroke-width="3" opacity=".95"/>
</svg>
